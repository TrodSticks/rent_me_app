{% extends "base.html" %}
{% block content %}
    <div class="rm-auth">
        <div class="rm-auth-head">
            <img src="{{ url_for('static', filename='icons/icon.svg') }}" alt="">
            <h1>Welcome back</h1>
            <p>Sign in to your Rent Me account</p>
        </div>

        <div class="card">
            <div class="card-body p-4">
                <form method="POST" action=""><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email"
                               placeholder="your.email@example.com" autocomplete="email" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password"
                               placeholder="Enter your password" autocomplete="current-password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-dark btn-lg">Sign in</button>
                    </div>
                    <p class="text-center mt-3 mb-0">
                        <a href="{{ url_for('main.forgot_password') }}" class="small fw-semibold text-decoration-none">Forgot your password?</a>
                    </p>
                </form>
            </div>
        </div>

        <p class="text-center text-muted mt-3">
            Don't have an account?
            <a href="{{ url_for('main.register') }}" class="fw-semibold text-decoration-none">Create one</a>
        </p>

        <!-- Demo accounts -->
        <div class="card bg-light mt-4">
            <div class="card-body">
                <h2 class="h6 mb-2"><i class="fas fa-info-circle me-2"></i>Demo accounts</h2>
                <p class="small text-muted mb-2">For testing. The password for both is <strong>demo123</strong>.</p>
                <div class="d-flex flex-wrap gap-2">
                    <span class="rm-tag">Landlord: landlord@demo.com</span>
                    <span class="rm-tag">Renter: renter@demo.com</span>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
