{% extends "base.html" %}
{% block content %}
    <div class="rm-auth">
        <div class="rm-auth-head">
            <img src="{{ url_for('static', filename='icons/icon.svg') }}" alt="">
            <h1>Choose a new password</h1>
            <p>This link can be used once.</p>
        </div>

        <div class="card">
            <div class="card-body p-4">
                <form method="POST" action=""><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="new_password" class="form-label">New password</label>
                        <input type="password" class="form-control form-control-lg" id="new_password" name="new_password"
                               minlength="6" maxlength="128" autocomplete="new-password" required>
                        <div class="form-text">At least 6 characters.</div>
                    </div>
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">Confirm new password</label>
                        <input type="password" class="form-control form-control-lg" id="confirm_password" name="confirm_password"
                               minlength="6" maxlength="128" autocomplete="new-password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-dark btn-lg">Change password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
