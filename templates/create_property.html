{% extends "base.html" %}
{% block content %}
    <div class="content-section">
        <form method="POST" action="" enctype="multipart/form-data">
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">{{ title }}</legend>
                <div class="form-group mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="title" name="title" required maxlength="100" value="{{ values.title or '' }}">
                </div>
                <div class="form-group mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="5" required>{{ values.description or '' }}</textarea>
                </div>
                <div class="form-group mb-3">
                    <label for="property_type" class="form-label">Property Type</label>
                    <select class="form-control" id="property_type" name="property_type" required>
                        <option value="">Select Property Type</option>
                        <option value="house" {{ 'selected' if values.property_type == 'house' else '' }}>House</option>
                        <option value="flat" {{ 'selected' if values.property_type == 'flat' else '' }}>Flat/Apartment</option>
                    </select>
                </div>
                <div class="form-group mb-3">
                    <label for="price" class="form-label">Price (Pula per month)</label>
                    <input type="number" class="form-control" id="price" name="price" min="1" required value="{{ values.price or '' }}">
                </div>
                <div class="form-group mb-3">
                    <label for="location" class="form-label">Location</label>
                    <select class="form-control" id="location" name="location" required>
                        <option value="">Select Location</option>
                        {% for town in locations %}
                            <option value="{{ town }}" {{ 'selected' if values.location == town else '' }}>{{ town }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group mb-3">
                    <label for="bedrooms" class="form-label">Number of Bedrooms</label>
                    <input type="number" class="form-control" id="bedrooms" name="bedrooms" min="1" max="10" required value="{{ values.bedrooms or '' }}">
                </div>
                <div class="form-group mb-3">
                    <label for="image" class="form-label">Photo</label>
                    {% if property and property.image_file and property.image_file != 'default.jpg' %}
                        <div class="mb-2">
                            <img src="{{ url_for('static', filename='property_pics/' + property.image_file) }}"
                                 alt="Current photo" class="rounded" style="height: 120px; object-fit: cover;">
                            <div class="form-text">Current photo. Choose a new file to replace it.</div>
                        </div>
                    {% endif %}
                    <input type="file" class="form-control" id="image" name="image"
                           accept="image/jpeg,image/png,image/gif,image/webp">
                    <div class="form-text">JPG, PNG, GIF or WebP, up to 5 MB.</div>
                    <img id="image-preview" class="rounded mt-2 d-none" alt="Preview" style="height: 120px; object-fit: cover;">
                </div>
            </fieldset>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">{{ "Update" if property else "Add" }} Property</button>
                <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

    <script>
        // Show a preview of the chosen photo before uploading
        document.getElementById('image').addEventListener('change', function() {
            const preview = document.getElementById('image-preview');
            const file = this.files[0];
            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.classList.remove('d-none');
            } else {
                preview.classList.add('d-none');
            }
        });
    </script>
{% endblock %}
