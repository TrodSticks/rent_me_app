{% extends "base.html" %}
{% block content %}
    <div class="rm-auth">
        <div class="rm-auth-head">
            <img src="{{ url_for('static', filename='icons/icon.svg') }}" alt="">
            <h1>Create your account</h1>
            <p>Join Rent Me to find your next home</p>
        </div>

        <div class="card">
            <div class="card-body p-4">
                <form method="POST" action=""><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control form-control-lg" id="username" name="username"
                               placeholder="Choose a username" maxlength="20" autocomplete="username"
                               value="{{ form.username or '' }}" required>
                        <div class="form-text">Shown to other people on Rent Me. Up to 20 characters.</div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email"
                               placeholder="your.email@example.com" autocomplete="email"
                               value="{{ form.email or '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password"
                               placeholder="Create a password" minlength="6" autocomplete="new-password" required>
                        <div class="form-text">At least 6 characters.</div>
                    </div>

                    <fieldset class="mb-4">
                        <legend class="form-label">I am a...</legend>
                        <div class="row g-2">
                            <div class="col-6 role-option">
                                <input type="radio" class="btn-check" name="role" id="renter" value="Renter" {{ 'checked' if form.role != 'Landlord' }}>
                                <label class="btn" for="renter">
                                    <i class="fas fa-search fa-lg d-block mb-2"></i>
                                    <strong class="d-block">Renter</strong>
                                    <small class="text-muted">Looking for a place</small>
                                </label>
                            </div>
                            <div class="col-6 role-option">
                                <input type="radio" class="btn-check" name="role" id="landlord" value="Landlord" {{ 'checked' if form.role == 'Landlord' }}>
                                <label class="btn" for="landlord">
                                    <i class="fas fa-key fa-lg d-block mb-2"></i>
                                    <strong class="d-block">Landlord</strong>
                                    <small class="text-muted">Have a place to rent out</small>
                                </label>
                            </div>
                        </div>
                    </fieldset>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-dark btn-lg">Create account</button>
                    </div>
                </form>
            </div>
        </div>

        <p class="text-center text-muted mt-3">
            Already have an account?
            <a href="{{ url_for('main.login') }}" class="fw-semibold text-decoration-none">Sign in</a>
        </p>
    </div>
{% endblock %}
